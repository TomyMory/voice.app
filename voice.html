<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひらがなボイスブリッジ（段差乗り越え対応版）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #E0F7FA; font-family: sans-serif; }
        #ui-layer { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button, select { font-size: 16px; padding: 8px 12px; margin-right: 5px; cursor: pointer; }
        #status { margin-top: 10px; font-weight: bold; color: #333; }
        #target-marker { position: absolute; top: 0; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 30px solid #FF5722; transform: translateX(-50%); transition: left 0.5s ease; z-index: 5; }
    </style>
</head>
<body>

<div id="ui-layer">
    <h3>ひらがなボイスブリッジ</h3>
    <button id="record-btn">録音開始 (長押し)</button>
    <button id="walk-btn">キャラクターを歩かせる</button>
    <select id="font-select">
        <option value="sans-serif">ゴシック体</option>
        <option value="serif">明朝体</option>
        <option value="'ヒラギノ丸ゴ Pro W4', 'Hiragino Maru Gothic Pro', sans-serif">丸ゴシック</option>
    </select>
    <div id="status">マイクを許可して録音ボタンを長押ししてください</div>
</div>

<div id="target-marker"></div>

<script>
// --- 1. 物理エンジンのセットアップ ---
const Engine = Matter.Engine,
      Render = Matter.Render,
      Runner = Matter.Runner,
      Bodies = Matter.Bodies,
      Composite = Matter.Composite,
      Events = Matter.Events;

const engine = Engine.create();
const width = window.innerWidth;
const height = window.innerHeight;

const render = Render.create({
    element: document.body,
    engine: engine,
    options: {
        width: width,
        height: height,
        wireframes: false,
        background: '#E0F7FA'
    }
});

const surfaceY = height - 150; 
const segmentWidth = width / 5;

const groundOptions = { isStatic: true, render: { fillStyle: '#6D4C41' } };
const leftBank = Bodies.rectangle(segmentWidth * 0.5, surfaceY + 100, segmentWidth, 200, groundOptions);
const island = Bodies.rectangle(segmentWidth * 2.5, surfaceY + 100, segmentWidth, 200, groundOptions);
const rightBank = Bodies.rectangle(segmentWidth * 4.5, surfaceY + 100, segmentWidth, 200, groundOptions);

// キャラクター設定（少し滑りやすく調整）
const player = Bodies.circle(50, surfaceY - 20, 20, { 
    restitution: 0.1, friction: 0.3, density: 0.01, render: { fillStyle: '#FF5252' }
});

Composite.add(engine.world, [leftBank, island, rightBank, player]);

const holes = [
    { index: 0, x: segmentWidth * 1.5, width: segmentWidth },
    { index: 1, x: segmentWidth * 3.5, width: segmentWidth }
];
let currentHoleIndex = 0;

const marker = document.getElementById('target-marker');
function updateMarker() {
    if (currentHoleIndex < holes.length) {
        marker.style.left = holes[currentHoleIndex].x + 'px';
    } else {
        marker.style.display = 'none'; 
    }
}
updateMarker();

Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);

// --- 2. 文字のカスタム描画 ---
let textBlocks = [];
Events.on(render, 'afterRender', function() {
    const context = render.context;
    const selectedFont = document.getElementById('font-select').value;
    
    textBlocks.forEach(blockData => {
        const body = blockData.body;
        const text = blockData.text;
        const pos = body.position;
        const angle = body.angle;
        
        const w = body.bounds.max.x - body.bounds.min.x;
        const h = body.bounds.max.y - body.bounds.min.y;

        context.save();
        context.translate(pos.x, pos.y);
        context.rotate(angle);
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        
        context.font = `bold ${h}px ${selectedFont}`;
        const textMetrics = context.measureText(text);
        const textWidth = textMetrics.width;
        
        // テキストの幅が0の場合はエラーを防ぐ
        if(textWidth > 0) {
            const scaleX = w / textWidth;
            context.scale(scaleX, 1); 
            context.fillStyle = body.isStatic ? '#1A237E' : '#37474F'; // 固定されたら色を少し変える
            context.fillText(text, 0, 0);
        }
        context.restore();
    });
});

// --- 3. 穴が塞がったかの自動判定 ＆ 【修正】橋の固定化 ---
Events.on(engine, 'afterUpdate', function() {
    if (currentHoleIndex >= holes.length) return;
    const targetHole = holes[currentHoleIndex];
    let isBridgeBuilt = false;

    for (let i = 0; i < textBlocks.length; i++) {
        const body = textBlocks[i].body;
        if (body.position.x > targetHole.x - targetHole.width / 2 &&
            body.position.x < targetHole.x + targetHole.width / 2) {
            
            if (body.speed < 1.0 && body.position.y > 0 && body.bounds.min.y <= surfaceY + 10) {
                isBridgeBuilt = true;
                break;
            }
        }
    }

    if (isBridgeBuilt) {
        // ★修正: 橋が完成したら、その穴付近にあるブロックを固定(isStatic=true)して崩れないようにする
        textBlocks.forEach(b => {
            const body = b.body;
            if (body.position.x > targetHole.x - targetHole.width / 2 - 50 &&
                body.position.x < targetHole.x + targetHole.width / 2 + 50) {
                Matter.Body.setStatic(body, true);
            }
        });

        currentHoleIndex++;
        updateMarker();
        const statusText = document.getElementById('status');
        if (currentHoleIndex < holes.length) {
            statusText.innerText = "橋が固定されました！次の穴へ移動します。";
        } else {
            statusText.innerText = "全ての穴が塞がりました！キャラを歩かせてみましょう。";
        }
    }
});


// --- 4. 音声認識とブロック生成 ---
let audioContext, analyser, microphone, dataArray;
let isRecording = false, maxVolume = 0, startTime = 0;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();
recognition.lang = 'ja-JP';

async function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        microphone = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        microphone.connect(analyser);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
}

function updateVolume() {
    if (!isRecording) return;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i];
    }
    let average = sum / dataArray.length;
    if (average > maxVolume) maxVolume = average;
    requestAnimationFrame(updateVolume);
}

const recordBtn = document.getElementById('record-btn');
const statusText = document.getElementById('status');

recordBtn.addEventListener('mousedown', async () => {
    if (currentHoleIndex >= holes.length) {
        statusText.innerText = "もう塞ぐ穴はありません。"; return;
    }
    await initAudio();
    isRecording = true; maxVolume = 0; startTime = Date.now();
    recognition.start(); updateVolume();
    statusText.innerText = "録音中... 声を出してください（最大5秒）";
});

recordBtn.addEventListener('mouseup', () => {
    if (!isRecording) return;
    isRecording = false; recognition.stop();
    statusText.innerText = "解析中...";
});

recognition.onresult = (event) => {
    const resultText = event.results[0][0].transcript;
    const char = resultText.charAt(0); 
    
    let duration = Date.now() - startTime;
    if (duration > 5000) duration = 5000;

    createHiraganaBlock(char, maxVolume, duration);
    statusText.innerText = `認識:「${char}」 / 音量: ${Math.floor(maxVolume)} / 長さ: ${duration}ms`;
};

function createHiraganaBlock(char, volume, duration) {
    if (currentHoleIndex >= holes.length) return;
    
    let blockHeight = Math.max(40, volume * 1.5);
    let blockWidth = Math.max(40, (duration / 5000) * (width * 0.4)); 
    const dropX = holes[currentHoleIndex].x;

    // ★修正: 角を丸く(chamfer)して、ボールが引っかかりにくくする
    const chamferRadius = Math.min(blockWidth, blockHeight) * 0.15;

    const block = Bodies.rectangle(dropX, -100, blockWidth, blockHeight, {
        restitution: 0.1,
        friction: 0.9, 
        density: 0.05,
        chamfer: { radius: chamferRadius }, 
        render: { visible: false } 
    });

    Composite.add(engine.world, block);
    textBlocks.push({ body: block, text: char });
}

// --- 5. 【修正】キャラクターの歩行と段差乗り越え制御 ---
document.getElementById('walk-btn').addEventListener('click', () => {
    statusText.innerText = "歩行中...";
    
    // 50ミリ秒ごとに速度を監視・上書きして力強く進ませる
    const checkInterval = setInterval(() => {
        if (player.position.y > height) {
            statusText.innerText = "ゲームオーバー！落ちてしまいました...";
            clearInterval(checkInterval);
        } else if (player.position.x > width - (segmentWidth / 2)) {
            statusText.innerText = "クリア！！対岸にたどり着きました！";
            clearInterval(checkInterval);
        } else {
            // ★修正: 段差乗り越え（オートジャンプ）ロジック
            if (player.velocity.x < 1.0) {
                // X方向の速度が遅い＝段差に引っかかっている場合
                // 少し上に速度を与えて(y: -5)ジャンプし、段差を強引によじ登る
                Matter.Body.setVelocity(player, { x: 2, y: -5 });
            } else {
                // 通常は一定の速度(x: 3)で前進。Y軸は自然落下に任せる
                Matter.Body.setVelocity(player, { x: 3, y: player.velocity.y });
            }
        }
    }, 50);
});
</script>
</body>
</html>
